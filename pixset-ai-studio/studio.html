<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixset AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --neon-yellow: #ffd700; --neon-cyan: #39ff14; --neon-purple: #bf00ff; --neon-pink: #ff006e;
  --bg-deep: #020408; --bg-card: #08141c; --bg-sidebar: #0a1620;
  --grid-color: rgba(57, 255, 20, 0.04); --border-dim: rgba(57, 255, 20, 0.12);
  --text-dim: rgba(180, 220, 255, 0.6); --text-mid: rgba(200, 230, 255, 0.85); --text-bright: #cce8ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background-color: var(--bg-deep); color: var(--text-mid);
  font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden;
  background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: 30px 30px;
}

/* Layout */
.app-container { display: flex; height: 100vh; width: 100%; position: relative; }

.main-content {
  flex: 1; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(circle at 50% 50%, rgba(8, 20, 28, 0.5) 0%, transparent 100%);
}

/* Header */
header {
  height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border-dim); background: rgba(2, 4, 8, 0.8); backdrop-filter: blur(10px); z-index: 10;
}
.chat-info { display: flex; align-items: center; gap: 12px; }
.chat-title { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; color: var(--neon-cyan); text-transform: uppercase; }

.user-profile { display: flex; align-items: center; gap: 10px; }
.user-name { font-size: 13px; font-weight: 600; color: var(--text-bright); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--neon-cyan); object-fit: cover; background: var(--bg-card); }

/* Chat Area */
.messages-area {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px;
  scrollbar-width: thin; scrollbar-color: var(--border-dim) transparent;
}
.messages-area::-webkit-scrollbar { width: 4px; }
.messages-area::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 10px; }

.message { max-width: 85%; display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message.user { align-self: flex-end; }
.message.assistant { align-self: flex-start; }

.message-content {
  padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; position: relative;
  word-wrap: break-word; font-family: 'Rajdhani', sans-serif;
}
.message.user .message-content {
  background: rgba(57, 255, 20, 0.08); border: 1px solid rgba(57, 255, 20, 0.2);
  color: var(--text-bright); border-bottom-right-radius: 2px;
}
.message.assistant .message-content {
  background: rgba(180, 220, 255, 0.05); border: 1px solid rgba(180, 220, 255, 0.1);
  color: var(--text-mid); border-bottom-left-radius: 2px;
}
.message-content img { max-width: 100%; border-radius: 8px; margin: 10px 0; border: 1px solid var(--border-dim); }

/* Empty State */
.empty-state {
  margin: auto; display: flex; flex-direction: column; align-items: center; gap: 15px; opacity: 0.5;
}
.empty-icon { font-size: 40px; filter: drop-shadow(0 0 10px var(--neon-cyan)); }
.empty-title { font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 3px; color: var(--neon-cyan); }

/* Input Area */
.input-container {
  padding: 15px 20px 25px; background: linear-gradient(to top, var(--bg-deep) 80%, transparent);
  border-top: 1px solid var(--border-dim); position: relative;
}

/* Tool Bar - New */
.tool-bar {
  display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
.tool-bar::-webkit-scrollbar { display: none; }

.tool-btn {
  background: rgba(2, 4, 8, 0.6); border: 1px solid var(--border-dim);
  color: var(--text-dim); padding: 6px 12px; border-radius: 20px;
  font-size: 11px; font-family: 'Orbitron', sans-serif; cursor: pointer;
  transition: all 0.2s ease; white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.tool-btn:hover { border-color: var(--neon-cyan); color: var(--text-bright); background: rgba(57, 255, 20, 0.05); }
.tool-btn.active { 
  background: rgba(57, 255, 20, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan);
  box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
}

.input-wrapper {
  background: rgba(10, 22, 32, 0.8); border: 1px solid var(--border-dim);
  border-radius: 16px; display: flex; align-items: flex-end; padding: 10px 15px;
  transition: all 0.3s ease; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
}
.input-wrapper:focus-within { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(57, 255, 20, 0.1), inset 0 0 15px rgba(0,0,0,0.5); }

textarea {
  flex: 1; background: none; border: none; outline: none; color: var(--text-bright);
  font-family: 'Rajdhani', sans-serif; font-size: 16px; resize: none; max-height: 150px;
  padding: 5px 0; margin-right: 10px;
}
textarea::placeholder { color: var(--text-dim); }

.action-buttons { display: flex; gap: 10px; align-items: center; }
.icon-btn {
  background: none; border: none; cursor: pointer; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.icon-btn:hover { color: var(--neon-cyan); filter: drop-shadow(0 0 5px var(--neon-cyan)); }
#send-btn { color: var(--neon-cyan); }
#send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Utility Buttons */
.util-btns { display: flex; gap: 10px; }
.util-btn {
  background: none; border: 1px solid var(--border-dim); color: var(--text-dim);
  padding: 5px 10px; border-radius: 4px; font-size: 10px; font-family: 'Orbitron', sans-serif;
  cursor: pointer; transition: 0.2s;
}
.util-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

@media (max-width: 768px) {
  .message { max-width: 92%; }
  .input-container { padding: 10px 15px 20px; }
  .tool-bar { margin-bottom: 8px; }
}
</style>
</head>
<body>

<div class="app-container">
  <div class="main-content">
    <header>
      <div class="chat-info">
        <div class="chat-title" id="chat-title">💬 PixGPT</div>
      </div>
      <div class="user-profile">
        <div class="util-btns">
          <button class="util-btn" onclick="clearChat()">🗑 ОЧИСТИТЬ</button>
          <button class="util-btn" onclick="logout()">🚪 ВЫХОД</button>
        </div>
        <span class="user-name" id="user-name">User</span>
        <img src="" alt="" class="user-avatar" id="user-avatar">
      </div>
    </header>

    <div class="messages-area" id="messages-area">
      <div class="empty-state">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">PIXSET STUDIO</div>
      </div>
    </div>

    <div class="input-container">
      <div class="tool-bar" id="tool-bar">
        <button class="tool-btn active" onclick="switchMode('chat', this)">💬 CHAT</button>
        <button class="tool-btn" onclick="switchMode('pixgen', this)">🖼 PIXGEN</button>
        <button class="tool-btn" onclick="switchMode('pixqr', this)">🔗 PIXQR</button>
        <button class="tool-btn" onclick="switchMode('pixupscale', this)">⬆ UPSCALE</button>
        <button class="tool-btn" onclick="switchMode('pixcut', this)">✂ CUT</button>
        <button class="tool-btn" onclick="switchMode('pixocr', this)">📝 OCR</button>
      </div>
      <div class="input-wrapper">
        <textarea id="input-field" placeholder="Напишите сообщение..." rows="1"></textarea>
        <div class="action-buttons">
          <button class="icon-btn" id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://pixset-api.robloksosipov.workers.dev';
let currentUser = null;
let currentMode = 'chat';
let chatHistory = [];
let isLoading = false;

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  const userStr = localStorage.getItem('currentUser');
  if (!userStr) {
    window.location.href = './';
    return;
  }
  currentUser = JSON.parse(userStr);
  document.getElementById('user-name').textContent = currentUser.firstName;
  document.getElementById('user-avatar').src = currentUser.photoUrl || 'https://via.placeholder.com/32';
  
  const textarea = document.getElementById('input-field');
  textarea.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });
  
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
});

function switchMode(mode, el) {
  currentMode = mode;
  document.querySelectorAll('.tool-btn').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  
  const titles = {
    chat: '💬 PixGPT',
    pixgen: '🖼 PixGen',
    pixqr: '🔗 PixQR',
    pixupscale: '⬆ PixUpscale',
    pixcut: '✂ PixCut',
    pixocr: '📝 PixOCR'
  };
  document.getElementById('chat-title').textContent = titles[mode];
  
  if (mode !== 'chat') {
    addMessage('assistant', `Режим **${mode.toUpperCase()}** активирован. Чем могу помочь?`);
  }
}

async function sendMessage() {
  const input = document.getElementById('input-field');
  const text = input.value.trim();
  if (!text || isLoading) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  try {
    if (currentMode === 'chat') {
      await handleChat(text);
    } else if (currentMode === 'pixgen') {
      await handlePixGen(text);
    } else if (currentMode === 'pixqr') {
      await handlePixQR(text);
    } else {
      addMessage('assistant', 'Этот инструмент пока доступен только в боте. Скоро добавим и сюда!');
    }
  } catch (e) {
    addMessage('assistant', '❌ Ошибка: ' + e.message);
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
  }
}

async function handleChat(text) {
  const systemPrompt = "You are Pixset GPT, a helpful AI assistant in Pixset AI Studio. Respond in the same language as the user.";
  const messages = [{ role: 'system', content: systemPrompt }, ...chatHistory, { role: 'user', content: text }];
  
  const res = await fetch('https://text.pollinations.ai/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: messages,
      model: 'openai',
      seed: Math.floor(Math.random() * 1000000)
    })
  });
  
  if (!res.ok) throw new Error('API чата временно недоступно');
  
  const reply = await res.text();
  addMessage('assistant', reply);
  chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
  logUsage('pixgpt');
}

async function handlePixGen(text) {
  addMessage('assistant', '🎨 Генерирую изображение по вашему запросу...');
  const seed = Math.floor(Math.random() * 1000000);
  const url = `https://pollinations.ai/p/${encodeURIComponent(text)}?width=1024&height=1024&seed=${seed}&nologo=true`;
  
  const img = new Image();
  img.src = url;
  img.onload = () => {
    const area = document.getElementById('messages-area');
    const msg = document.createElement('div');
    msg.className = 'message assistant';
    msg.innerHTML = `<div class="message-content"><img src="${url}" alt="Generated"><br><a href="${url}" target="_blank" style="color:var(--neon-cyan);font-size:10px;text-decoration:none;margin-top:5px;display:inline-block;">⬇ СКАЧАТЬ ОРИГИНАЛ</a></div>`;
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
    logUsage('pixgen');
  };
}

async function handlePixQR(text) {
  addMessage('assistant', '🔗 Создаю ваш QR-код...');
  const container = document.createElement('div');
  container.style.padding = '10px';
  container.style.background = 'white';
  container.style.display = 'inline-block';
  container.style.borderRadius = '8px';
  
  new QRCode(container, { text, width: 200, height: 200 });
  
  const area = document.getElementById('messages-area');
  const msg = document.createElement('div');
  msg.className = 'message assistant';
  const content = document.createElement('div');
  content.className = 'message-content';
  content.appendChild(container);
  msg.appendChild(content);
  area.appendChild(msg);
  area.scrollTop = area.scrollHeight;
  logUsage('pixqr');
}

function addMessage(role, text) {
  const area = document.getElementById('messages-area');
  if (area.querySelector('.empty-state')) area.innerHTML = '';
  
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  msg.innerHTML = `<div class="message-content">${DOMPurify.sanitize(marked.parse(text))}</div>`;
  area.appendChild(msg);
  area.scrollTop = area.scrollHeight;
}

async function logUsage(action) {
  try {
    fetch(`${API_URL}/api/usage/log`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser.id, action })
    });
  } catch (e) {}
}

function clearChat() {
  document.getElementById('messages-area').innerHTML = '<div class="empty-state"><div class="empty-icon">🤖</div><div class="empty-title">PIXSET STUDIO</div></div>';
  chatHistory = [];
}

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = './';
}
</script>
</body>
</html>
