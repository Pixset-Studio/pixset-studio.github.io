<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixset AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --neon-yellow: #ffd700; --neon-cyan: #39ff14; --neon-purple: #bf00ff; --neon-pink: #ff006e;
  --bg-deep: #020408; --bg-card: #08141c; --bg-sidebar: #0a1620;
  --grid-color: rgba(57, 255, 20, 0.04); --border-dim: rgba(57, 255, 20, 0.12);
  --text-dim: rgba(180, 220, 255, 0.6); --text-mid: rgba(200, 230, 255, 0.85); --text-bright: #cce8ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-deep); }
body { color: var(--text-bright); font-family: 'Rajdhani', sans-serif; font-size: 15px; position: fixed; inset: 0; }

.grid-bg { position: fixed; inset: 0; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; z-index: 0; pointer-events: none; }

/* ── LAYOUT ── */
.app-container { position: relative; z-index: 2; display: flex; height: 100%; width: 100%; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-dim); display: flex; flex-direction: column; z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-dim); }
.sidebar-title { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; color: var(--neon-cyan); letter-spacing: 1px; text-transform: uppercase; }
.sidebar-content { flex: 1; overflow-y: auto; padding: 10px 0; }
.sidebar-item { padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; color: var(--text-dim); font-size: 13px; transition: all 0.2s; text-transform: uppercase; font-family: 'Share Tech Mono', monospace; display: flex; align-items: center; gap: 10px; }
.sidebar-item:hover { background: rgba(57, 255, 20, 0.05); color: var(--neon-cyan); }
.sidebar-item.active { border-left-color: var(--neon-cyan); background: rgba(57, 255, 20, 0.1); color: var(--neon-cyan); }
.sidebar-footer { padding: 15px; border-top: 1px solid var(--border-dim); display: flex; gap: 10px; }

/* MAIN CHAT */
.chat-container { flex: 1; display: flex; flex-direction: column; background: rgba(2, 4, 8, 0.7); position: relative; min-width: 0; }
.chat-header { height: 64px; min-height: 64px; padding: 0 20px; border-bottom: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: space-between; background: rgba(2, 4, 8, 0.9); backdrop-filter: blur(10px); z-index: 10; }
.chat-title { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; color: var(--neon-cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-section { display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--neon-cyan); object-fit: cover; }
.user-name { font-size: 12px; color: var(--text-mid); font-family: 'Share Tech Mono', monospace; display: block; }

/* MESSAGES */
.messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
.message { display: flex; gap: 12px; width: 100%; }
.message.user { flex-direction: row-reverse; }
.message-content { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-wrap: break-word; position: relative; }
.message.user .message-content { background: rgba(57, 255, 20, 0.1); border: 1px solid rgba(57, 255, 20, 0.3); color: var(--text-bright); border-bottom-right-radius: 2px; }
.message.assistant .message-content { background: rgba(191, 0, 255, 0.05); border: 1px solid rgba(191, 0, 255, 0.2); color: var(--text-bright); border-bottom-left-radius: 2px; }
.message img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-dim); }

/* INPUT AREA */
.input-area { padding: 20px; background: linear-gradient(to top, var(--bg-deep) 80%, transparent); z-index: 10; }
.input-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 12px; background: rgba(10, 22, 32, 0.9); border: 1px solid var(--border-dim); padding: 8px 12px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
.input-field { flex: 1; background: transparent; border: none; color: var(--text-bright); font-family: 'Rajdhani', sans-serif; font-size: 15px; outline: none; padding: 8px 4px; resize: none; min-height: 24px; max-height: 150px; line-height: 1.4; }
.send-btn { background: transparent; border: none; color: var(--neon-cyan); cursor: pointer; padding: 4px 8px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
.send-btn:hover { transform: scale(1.1); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* UTILS */
.btn-small { padding: 8px 12px; background: rgba(57, 255, 20, 0.05); border: 1px solid var(--border-dim); color: var(--text-dim); cursor: pointer; font-size: 11px; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; border-radius: 4px; transition: all 0.2s; }
.btn-small:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
.logout-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

.sidebar-toggle { display: none; background: transparent; border: none; color: var(--neon-cyan); font-size: 24px; cursor: pointer; margin-right: 15px; }

/* MOBILE */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 280px; box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: block; }
  .message-content { max-width: 90%; font-size: 13px; }
  .input-area { padding: 12px; }
  .user-name { display: none; }
  .chat-header { padding: 0 15px; }
}

/* EMPTY STATE */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; opacity: 0.5; }
.empty-icon { font-size: 64px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--neon-cyan)); }
.empty-title { font-family: 'Orbitron', monospace; font-size: 20px; color: var(--neon-cyan); margin-bottom: 10px; }

@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📚 Инструменты</div>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-item active" onclick="switchMode('chat', this)">💬 PixGPT</div>
      <div class="sidebar-item" onclick="switchMode('pixgen', this)">🖼 PixGen</div>
      <div class="sidebar-item" onclick="switchMode('pixqr', this)">🔗 PixQR</div>
      <div class="sidebar-item" onclick="switchMode('pixupscale', this)">⬆ PixUpscale</div>
      <div class="sidebar-item" onclick="switchMode('pixcut', this)">✂ PixCut</div>
      <div class="sidebar-item" onclick="switchMode('pixocr', this)">📝 PixOCR</div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-small" onclick="clearChat()">🗑 Очистить</button>
      <button class="btn-small logout-btn" onclick="logout()">🚪 Выход</button>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <main class="chat-container">
    <header class="chat-header">
      <div style="display: flex; align-items: center;">
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <div class="chat-title" id="chat-title">💬 PixGPT</div>
      </div>
      <div class="user-section">
        <span class="user-name" id="user-name">User</span>
        <img id="user-avatar" class="user-avatar" src="" alt="">
      </div>
    </header>

    <div class="messages-area" id="messages-area">
      <div class="empty-state">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">PIXSET STUDIO</div>
        <p style="font-size: 12px; font-family: 'Share Tech Mono';">READY FOR INPUT_</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="input-field" class="input-field" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://pixset-api.robloksosipov.workers.dev';
let currentUser = null;
let currentMode = 'chat';
let chatHistory = [];
let isLoading = false;

document.addEventListener('DOMContentLoaded', () => {
  const userStr = localStorage.getItem('currentUser');
  if (!userStr) { window.location.href = './'; return; }
  
  currentUser = JSON.parse(userStr);
  document.getElementById('user-name').textContent = currentUser.firstName || currentUser.username || 'User';
  if (currentUser.photoUrl) {
    document.getElementById('user-avatar').src = currentUser.photoUrl;
  }

  const input = document.getElementById('input-field');
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function switchMode(mode, el) {
  currentMode = mode;
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  
  const titles = {
    chat: '💬 PixGPT',
    pixgen: '🖼 PixGen',
    pixqr: '🔗 PixQR',
    pixupscale: '⬆ PixUpscale',
    pixcut: '✂ PixCut',
    pixocr: '📝 PixOCR'
  };
  document.getElementById('chat-title').textContent = titles[mode];
  
  if (window.innerWidth <= 768) toggleSidebar();
  addMessage('assistant', `Режим **${mode.toUpperCase()}** активирован. Чем могу помочь?`);
}

async function sendMessage() {
  const input = document.getElementById('input-field');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  try {
    if (currentMode === 'chat') {
      await handleChat(text);
    } else if (currentMode === 'pixgen') {
      await handlePixGen(text);
    } else if (currentMode === 'pixqr') {
      await handlePixQR(text);
    } else {
      addMessage('assistant', 'Этот инструмент пока доступен только в боте. Скоро добавим и сюда!');
    }
  } catch (e) {
    addMessage('assistant', '❌ Ошибка: ' + e.message);
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
  }
}

async function handleChat(text) {
  const res = await fetch('https://api.pollinations.ai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'openai',
      messages: [...chatHistory, { role: 'user', content: text }]
    })
  });
  const data = await res.json();
  const reply = data.choices[0].message.content;
  addMessage('assistant', reply);
  chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
  logUsage('pixgpt');
}

async function handlePixGen(text) {
  addMessage('assistant', '🎨 Генерирую изображение по вашему запросу...');
  const seed = Math.floor(Math.random() * 1000000);
  const url = `https://pollinations.ai/p/${encodeURIComponent(text)}?width=1024&height=1024&seed=${seed}&nologo=true`;
  
  const img = new Image();
  img.src = url;
  img.onload = () => {
    const area = document.getElementById('messages-area');
    const msg = document.createElement('div');
    msg.className = 'message assistant';
    msg.innerHTML = `<div class="message-content"><img src="${url}" alt="Generated"><br><a href="${url}" target="_blank" style="color:var(--neon-cyan);font-size:10px;text-decoration:none;margin-top:5px;display:inline-block;">⬇ СКАЧАТЬ ОРИГИНАЛ</a></div>`;
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
    logUsage('pixgen');
  };
}

async function handlePixQR(text) {
  addMessage('assistant', '🔗 Создаю ваш QR-код...');
  const container = document.createElement('div');
  container.style.padding = '10px';
  container.style.background = 'white';
  container.style.display = 'inline-block';
  container.style.borderRadius = '8px';
  
  new QRCode(container, { text, width: 200, height: 200 });
  
  const area = document.getElementById('messages-area');
  const msg = document.createElement('div');
  msg.className = 'message assistant';
  const content = document.createElement('div');
  content.className = 'message-content';
  content.appendChild(container);
  msg.appendChild(content);
  area.appendChild(msg);
  area.scrollTop = area.scrollHeight;
  logUsage('pixqr');
}

function addMessage(role, text) {
  const area = document.getElementById('messages-area');
  if (area.querySelector('.empty-state')) area.innerHTML = '';
  
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  msg.innerHTML = `<div class="message-content">${DOMPurify.sanitize(marked.parse(text))}</div>`;
  area.appendChild(msg);
  area.scrollTop = area.scrollHeight;
}

async function logUsage(action) {
  try {
    await fetch(`${API_URL}/api/usage/log`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser.id, action })
    });
  } catch (e) {}
}

function clearChat() {
  document.getElementById('messages-area').innerHTML = '<div class="empty-state"><div class="empty-icon">🤖</div><div class="empty-title">PIXSET STUDIO</div></div>';
  chatHistory = [];
}

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = './';
}
</script>
</body>
</html>
