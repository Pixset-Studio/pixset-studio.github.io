<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixset AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --neon-yellow: #ffd700; --neon-cyan: #39ff14; --neon-purple: #bf00ff; --neon-pink: #ff006e;
  --bg-deep: #020408; --bg-card: #08141c; --bg-sidebar: #0a1620;
  --grid-color: rgba(57, 255, 20, 0.04); --border-dim: rgba(57, 255, 20, 0.12);
  --text-dim: rgba(180, 220, 255, 0.6); --text-mid: rgba(200, 230, 255, 0.85); --text-bright: #cce8ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg-deep); color: var(--text-bright); font-family: 'Rajdhani', sans-serif; font-size: 15px; overflow: hidden; }
.grid-bg { position: fixed; inset: 0; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; z-index: 0; pointer-events: none; }

/* ── LAYOUT ── */
.app-container { position: relative; z-index: 2; display: flex; height: 100vh; width: 100vw; overflow: hidden; }
.sidebar { width: 280px; background: rgba(10, 22, 32, 0.98); border-right: 1px solid var(--border-dim); display: flex; flex-direction: column; overflow: hidden; transition: transform 0.3s ease; z-index: 1001; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-dim); }
.sidebar-title { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; color: var(--neon-cyan); letter-spacing: 1px; text-transform: uppercase; }
.sidebar-content { flex: 1; overflow-y: auto; padding: 12px 0; }
.sidebar-item { padding: 10px 16px; cursor: pointer; border-left: 2px solid transparent; color: var(--text-dim); font-size: 12px; transition: all 0.3s; text-transform: uppercase; font-family: 'Share Tech Mono', monospace; }
.sidebar-item:hover { background: rgba(57, 255, 20, 0.05); color: var(--neon-cyan); }
.sidebar-item.active { border-left-color: var(--neon-cyan); background: rgba(57, 255, 20, 0.1); color: var(--neon-cyan); }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border-dim); display: flex; gap: 8px; }
.btn-small { flex: 1; padding: 8px 12px; background: rgba(57, 255, 20, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); cursor: pointer; font-size: 10px; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; border-radius: 4px; transition: all 0.3s; }
.btn-small:hover { background: var(--neon-cyan); color: #000; }

/* ── MAIN CHAT ── */
.chat-container { flex: 1; display: flex; flex-direction: column; }
.chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: space-between; }
.chat-title { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; color: var(--neon-cyan); }
.user-section { display: flex; align-items: center; gap: 12px; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--neon-cyan); }
.user-name { font-size: 12px; color: var(--text-mid); font-family: 'Share Tech Mono', monospace; }
.logout-btn { padding: 6px 12px; background: rgba(255, 0, 110, 0.1); border: 1px solid var(--neon-pink); color: var(--neon-pink); cursor: pointer; font-size: 9px; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; border-radius: 4px; }

/* ── MESSAGES ── */
.messages-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.message { display: flex; gap: 12px; animation: slideIn 0.3s ease-out; }
.message.user { justify-content: flex-end; }
.message.assistant { justify-content: flex-start; }
.message-content { max-width: 70%; padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
.message.user .message-content { background: rgba(57, 255, 20, 0.15); border: 1px solid var(--neon-cyan); color: var(--text-bright); }
.message.assistant .message-content { background: rgba(191, 0, 255, 0.1); border: 1px solid var(--neon-purple); color: var(--text-bright); }
.message-image { max-width: 100%; border-radius: 8px; border: 1px solid var(--border-dim); margin-top: 8px; }
.message-actions { display: flex; gap: 8px; margin-top: 8px; }
.action-btn { padding: 6px 12px; background: rgba(57, 255, 20, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); cursor: pointer; font-size: 10px; border-radius: 4px; transition: all 0.3s; font-family: 'Share Tech Mono', monospace; }
.action-btn:hover { background: var(--neon-cyan); color: #000; }

/* ── INPUT ── */
.input-area { padding: 16px; border-top: 1px solid var(--border-dim); background: var(--bg-deep); position: relative; z-index: 10; }
.input-wrapper { display: flex; gap: 12px; }
.input-field { flex: 1; padding: 12px 16px; background: rgba(8, 20, 28, 0.6); border: 1px solid var(--border-dim); color: var(--text-bright); font-family: 'Rajdhani', sans-serif; font-size: 14px; border-radius: 8px; resize: none; max-height: 100px; }
.send-btn { padding: 12px 20px; background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan); cursor: pointer; font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 4px; transition: all 0.3s; }
.send-btn:hover { background: var(--neon-cyan); color: #000; }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── MODES ── */
.mode-selector { display: flex; gap: 8px; margin-bottom: 12px; }
.mode-btn { flex: 1; padding: 8px; background: rgba(57, 255, 20, 0.05); border: 1px solid var(--border-dim); color: var(--text-dim); cursor: pointer; font-size: 10px; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; border-radius: 4px; transition: all 0.3s; }
.mode-btn.active { background: rgba(57, 255, 20, 0.2); border-color: var(--neon-cyan); color: var(--neon-cyan); }

/* ── EMPTY STATE ── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-family: 'Orbitron', monospace; font-size: 18px; color: var(--neon-cyan); margin-bottom: 8px; }
.empty-desc { color: var(--text-dim); font-size: 12px; max-width: 300px; }

/* ── LOADING ── */
.loading { display: inline-flex; gap: 4px; }
.loading span { width: 4px; height: 4px; background: var(--neon-cyan); border-radius: 50%; animation: pulse 1.4s infinite; }
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
@keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(57, 255, 20, 0.6); }

/* ── MOBILE OPTIMIZATION ── */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: 0; top: 64px; bottom: 0; transform: translateX(-100%); width: 260px; }
  .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
  .message-content { max-width: 92%; font-size: 13px; }
  .chat-header { padding: 12px 16px; }
  .input-area { padding: 12px; }
  .sidebar-toggle { display: block !important; }
}
.sidebar-toggle { display: none; background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px; cursor: pointer; border-radius: 4px; font-family: 'Orbitron', monospace; font-size: 10px; }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="app-container">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📚 Режимы</div>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-item active" data-mode="chat">💬 PixGPT</div>
      <div class="sidebar-item" data-mode="pixgen">🖼 PixGen</div>
      <div class="sidebar-item" data-mode="pixqr">🔗 PixQR</div>
      <div class="sidebar-item" data-mode="pixupscale">⬆ PixUpscale</div>
      <div class="sidebar-item" data-mode="pixcut">✂ PixCut</div>
      <div class="sidebar-item" data-mode="pixocr">📝 PixOCR</div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-small" onclick="clearChat()">🗑 Очистить</button>
      <button class="btn-small logout-btn" onclick="logout()">🚪 Выход</button>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-container">
    <!-- HEADER -->
    <div class="chat-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <div class="chat-title" id="chat-title">💬 PixGPT</div>
      </div>
      <div class="user-section">
        <img id="user-avatar" class="user-avatar" alt="Avatar">
        <div class="user-name" id="user-name">User</div>
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="messages-area" id="messages-area">
      <div class="empty-state">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">Pixset AI Studio</div>
        <div class="empty-desc">Выберите режим и начните диалог. Все инструменты интегрированы в один интерфейс.</div>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="mode-selector" id="mode-selector" style="display: none;">
        <button class="mode-btn active" data-mode="chat">💬 Чат</button>
        <button class="mode-btn" data-mode="pixgen">🖼 Генерация</button>
        <button class="mode-btn" data-mode="pixqr">🔗 QR</button>
      </div>
      <div class="input-wrapper">
        <textarea id="input-field" class="input-field" placeholder="Напишите сообщение или команду..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">📤 Отправить</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://pixset-api-production.up.railway.app';
let currentUser = null;
let currentMode = 'chat';
let chatHistory = [];
let isLoading = false;

document.addEventListener('DOMContentLoaded', async () => {
  const userStr = localStorage.getItem('currentUser');
  if (!userStr) { window.location.href = '/pixset-ai-studio/'; return; }
  
  currentUser = JSON.parse(userStr);
  document.getElementById('user-name').textContent = currentUser.firstName || currentUser.username || 'User';
  if (currentUser.photoUrl) {
    document.getElementById('user-avatar').src = currentUser.photoUrl;
  }

  // Sidebar mode switching
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.onclick = () => switchMode(item.getAttribute('data-mode'));
  });

  // Input field auto-resize
  const inputField = document.getElementById('input-field');
  inputField.addEventListener('input', () => {
    inputField.style.height = 'auto';
    inputField.style.height = Math.min(inputField.scrollHeight, 100) + 'px';
  });

  // Enter to send
  inputField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
});

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
}

function switchMode(mode) {
  currentMode = mode;
  chatHistory = [];
  document.getElementById('messages-area').innerHTML = '';
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  if (event) event.target.classList.add('active');
  if (window.innerWidth <= 768) toggleSidebar();

  const titles = {
    chat: '💬 PixGPT — Умный чат',
    pixgen: '🖼 PixGen — Генерация изображений',
    pixqr: '🔗 PixQR — Создание QR-кодов',
    pixupscale: '⬆ PixUpscale — Увеличение фото',
    pixcut: '✂ PixCut — Удаление фона',
    pixocr: '📝 PixOCR — Распознавание текста'
  };
  document.getElementById('chat-title').textContent = titles[mode] || 'Pixset AI Studio';

  addMessage('assistant', `Режим **${mode.toUpperCase()}** активирован. Как я могу вам помочь?`);
}

async function sendMessage() {
  const input = document.getElementById('input-field');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  isLoading = true;

  try {
    if (currentMode === 'chat') {
      await handleChatMode(text);
    } else if (currentMode === 'pixgen') {
      await handlePixGenMode(text);
    } else if (currentMode === 'pixqr') {
      await handlePixQRMode(text);
    } else if (currentMode === 'pixupscale') {
      addMessage('assistant', 'Загрузите фото, чтобы увеличить его разрешение.');
    } else if (currentMode === 'pixcut') {
      addMessage('assistant', 'Загрузите фото для удаления фона.');
    } else if (currentMode === 'pixocr') {
      addMessage('assistant', 'Загрузите фото для распознавания текста.');
    }
  } catch (e) {
    addMessage('assistant', '❌ Ошибка: ' + e.message);
  }
  isLoading = false;
}

async function handleChatMode(text) {
  addMessage('assistant', '<div class="loading"><span></span><span></span><span></span></div>');
  try {
    const res = await fetch('https://api.pollinations.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'openai',
        messages: [...chatHistory, { role: 'user', content: text }]
      })
    });
    const data = await res.json();
    const reply = data.choices[0].message.content;
    
    document.querySelector('.message:last-child .message-content').innerHTML = DOMPurify.sanitize(marked.parse(reply));
    chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
    await logUsage('pixgpt');
  } catch (e) {
    document.querySelector('.message:last-child .message-content').textContent = '❌ Ошибка при получении ответа';
  }
}

async function handlePixGenMode(text) {
  addMessage('assistant', '⏳ Генерирую изображение...');
  try {
    const url = `https://api.pollinations.ai/v1/images?prompt=${encodeURIComponent(text)}&seed=${Math.floor(Math.random()*1000000)}`;
    const img = document.createElement('img');
    img.src = url;
    img.onload = () => {
      const lastMsg = document.querySelector('.message:last-child .message-content');
      lastMsg.innerHTML = '';
      lastMsg.appendChild(img);
      
      const actions = document.createElement('div');
      actions.className = 'message-actions';
      actions.innerHTML = `
        <button class="action-btn" onclick="downloadImage('${url}')">⬇ Скачать</button>
        <button class="action-btn" onclick="copyToClipboard('${url}')">📋 Ссылка</button>
      `;
      lastMsg.appendChild(actions);
      logUsage('pixgen');
    };
  } catch (e) {
    document.querySelector('.message:last-child .message-content').textContent = '❌ Ошибка генерации';
  }
}

async function handlePixQRMode(text) {
  addMessage('assistant', '🎨 Создаю QR-код...');
  try {
    const container = document.createElement('div');
    container.style.display = 'inline-block';
    container.style.padding = '10px';
    container.style.background = 'white';
    container.style.borderRadius = '4px';
    
    new QRCode(container, { text, width: 200, height: 200 });
    
    const lastMsg = document.querySelector('.message:last-child .message-content');
    lastMsg.innerHTML = '';
    lastMsg.appendChild(container);
    
    const actions = document.createElement('div');
    actions.className = 'message-actions';
    actions.innerHTML = `<button class="action-btn" onclick="downloadQR()">⬇ Скачать</button>`;
    lastMsg.appendChild(actions);
    logUsage('pixqr');
  } catch (e) {
    document.querySelector('.message:last-child .message-content').textContent = '❌ Ошибка создания QR';
  }
}

function addMessage(role, content) {
  const area = document.getElementById('messages-area');
  if (area.querySelector('.empty-state')) {
    area.innerHTML = '';
  }

  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  const contentDiv = document.createElement('div');
  contentDiv.className = 'message-content';
  
  if (role === 'assistant' && content.includes('<')) {
    contentDiv.innerHTML = content;
  } else {
    contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(content));
  }
  
  msg.appendChild(contentDiv);
  area.appendChild(msg);
  area.scrollTop = area.scrollHeight;
}

async function logUsage(action) {
  try {
    await fetch(`${API_URL}/api/usage/log`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser.id, action })
    });
  } catch (e) { console.warn('Log failed'); }
}

function downloadImage(url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pixset-image.png';
  a.click();
}

function downloadQR() {
  const canvas = document.querySelector('.message:last-child canvas');
  if (canvas) {
    const a = document.createElement('a');
    a.href = canvas.toDataURL();
    a.download = 'pixset-qr.png';
    a.click();
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => alert('✓ Скопировано'));
}

function clearChat() {
  document.getElementById('messages-area').innerHTML = '<div class="empty-state"><div class="empty-icon">🤖</div><div class="empty-title">Pixset AI Studio</div></div>';
  chatHistory = [];
}

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = '/pixset-ai-studio/';
}
</script>
</body>
</html>
