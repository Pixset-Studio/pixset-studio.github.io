<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixset AI Studio — Инструменты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --neon-yellow: #ffd700; --neon-cyan: #39ff14; --neon-purple: #bf00ff; --neon-pink: #ff006e;
  --bg-deep: #020408; --bg-card: #08141c; --grid-color: rgba(57, 255, 20, 0.04);
  --border-dim: rgba(57, 255, 20, 0.12); --text-dim: rgba(180, 220, 255, 0.6);
  --text-mid: rgba(200, 230, 255, 0.85); --text-bright: #cce8ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-deep); color: var(--text-bright); font-family: 'Rajdhani', sans-serif; font-size: 15px; overflow-x: hidden; }
.grid-bg { position: fixed; inset: 0; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; z-index: 0; pointer-events: none; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(2, 4, 8, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-dim); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
.nav-logo { font-family: 'Orbitron', monospace; font-weight: 900; font-size: 14px; color: var(--neon-yellow); text-decoration: none; letter-spacing: 2px; }
.user-info { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--neon-cyan); font-family: 'Share Tech Mono', monospace; }
.logout-btn { font-family: 'Share Tech Mono', monospace; font-size: 9px; padding: 6px 12px; background: rgba(255,0,110,0.1); border: 1px solid var(--neon-pink); color: var(--neon-pink); cursor: pointer; text-transform: uppercase; }
.container { position: relative; z-index: 2; margin-top: 64px; display: flex; height: calc(100vh - 64px); }
.sidebar { width: 240px; background: rgba(8, 20, 28, 0.8); border-right: 1px solid var(--border-dim); overflow-y: auto; padding: 20px 0; }
.sidebar-item { padding: 12px 20px; cursor: pointer; border-left: 2px solid transparent; color: var(--text-dim); font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.sidebar-item.active { border-left-color: var(--neon-cyan); background: rgba(57, 255, 20, 0.1); color: var(--neon-cyan); }
.content { flex: 1; overflow-y: auto; padding: 40px; }
.tool-section { display: none; }
.tool-section.active { display: block; }
.section-title { font-family: 'Orbitron', monospace; font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 8px; }
.section-desc { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--neon-cyan); margin-bottom: 8px; }
.form-input, .form-textarea, .form-select { width: 100%; padding: 12px 16px; background: rgba(8, 20, 28, 0.6); border: 1px solid var(--border-dim); color: var(--text-bright); font-family: 'Rajdhani', sans-serif; font-size: 14px; border-radius: 4px; }
.btn { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 12px 24px; background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan); cursor: pointer; border-radius: 4px; }
.btn:hover { color: #000; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
.output-box { background: rgba(8, 20, 28, 0.6); border: 1px solid var(--border-dim); border-radius: 4px; padding: 20px; margin-top: 24px; }
.chat-messages { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; margin-bottom: 20px; }
.message { padding: 12px 16px; border-radius: 4px; font-size: 13px; line-height: 1.5; }
.message.user { background: rgba(57, 255, 20, 0.1); border-left: 2px solid var(--neon-cyan); align-self: flex-end; max-width: 80%; }
.message.assistant { background: rgba(191, 0, 255, 0.1); border-left: 2px solid var(--neon-purple); align-self: flex-start; max-width: 80%; }
.image-preview { max-width: 100%; border-radius: 4px; border: 1px solid var(--border-dim); margin-top: 12px; }
.limits-bar { background: rgba(57, 255, 20, 0.05); border: 1px solid var(--neon-cyan); border-radius: 4px; padding: 12px; margin-bottom: 20px; font-family: 'Share Tech Mono', monospace; font-size: 11px; }
.limit-item { display: flex; justify-content: space-between; margin: 6px 0; }
.limit-fill-bg { width: 100%; height: 2px; background: rgba(57, 255, 20, 0.1); border-radius: 1px; margin-top: 4px; }
.limit-fill { height: 100%; background: var(--neon-cyan); border-radius: 1px; transition: width 0.3s; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<nav>
  <a href="/" class="nav-logo">PIXSET STUDIO</a>
  <div class="user-info">
    <img id="user-avatar" src="" alt="" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--neon-cyan); display: none;">
    <span id="user-name">User</span>
    <button class="logout-btn" onclick="logout()">ВЫХОД</button>
  </div>
</nav>
<div class="container">
  <div class="sidebar">
    <div class="sidebar-item active" data-tool="pixgen">🖼 PixGen</div>
    <div class="sidebar-item" data-tool="pixgpt">💬 PixGPT</div>
    <div class="sidebar-item" data-tool="pixqr">🔗 PixQR</div>
    <div class="sidebar-item" data-tool="pixupscale">⬆ PixUpscale</div>
    <div class="sidebar-item" data-tool="pixcut">✂ PixCut</div>
    <div class="sidebar-item" data-tool="pixocr">📝 PixOCR</div>
  </div>
  <div class="content">
    <div id="pixgen" class="tool-section active">
      <h2 class="section-title">🖼 PixGen</h2>
      <div class="limits-bar"><div class="limit-item"><span>Осталось сегодня:</span><span id="pixgen-limit">--/--</span></div><div class="limit-fill-bg"><div class="limit-fill" id="pixgen-fill"></div></div></div>
      <div class="form-group"><label class="form-label">Описание</label><textarea id="pixgen-prompt" class="form-textarea" placeholder="Например: Cyberpunk cat..."></textarea></div>
      <button class="btn" onclick="generateImage()">🚀 Генерировать</button>
      <div id="pixgen-output" class="output-box" style="display: none;"><img id="pixgen-result" class="image-preview" alt="Result"></div>
    </div>
    <div id="pixgpt" class="tool-section">
      <h2 class="section-title">💬 PixGPT</h2>
      <div class="limits-bar"><div class="limit-item"><span>Осталось сегодня:</span><span id="pixgpt-limit">--/--</span></div><div class="limit-fill-bg"><div class="limit-fill" id="pixgpt-fill"></div></div></div>
      <div class="output-box"><div class="chat-messages" id="pixgpt-messages"></div><div class="form-group"><input id="pixgpt-input" class="form-input" type="text" placeholder="Ваш вопрос..."></div><button class="btn" onclick="sendMessage()" style="width: 100%;">📤 Отправить</button></div>
    </div>
    <div id="pixqr" class="tool-section">
      <h2 class="section-title">🔗 PixQR</h2>
      <div class="limits-bar"><div class="limit-item"><span>Осталось сегодня:</span><span id="pixqr-limit">--/--</span></div><div class="limit-fill-bg"><div class="limit-fill" id="pixqr-fill"></div></div></div>
      <div class="form-group"><input id="pixqr-input" class="form-input" type="text" placeholder="https://..."><button class="btn" onclick="generateQR()" style="margin-top:10px">🎨 Создать</button></div>
      <div id="pixqr-output" class="output-box" style="display: none; text-align: center;"><div id="qr-code-display" style="display: inline-block; padding: 10px; background: white;"></div></div>
    </div>
    <div id="pixupscale" class="tool-section">
      <h2 class="section-title">⬆ PixUpscale</h2>
      <div class="form-group"><input id="pixupscale-input" class="form-input" type="file" accept="image/*"><button class="btn" onclick="upscaleImage()" style="margin-top:10px">⬆ Увеличить</button></div>
      <div id="pixupscale-output" class="output-box" style="display: none;"><img id="pixupscale-result" class="image-preview" alt="Upscaled"></div>
    </div>
    <div id="pixcut" class="tool-section"><h2 class="section-title">✂ PixCut</h2><p>⏳ В разработке...</p></div>
    <div id="pixocr" class="tool-section"><h2 class="section-title">📝 PixOCR</h2><p>⏳ В разработке...</p></div>
  </div>
</div>
<script>
const API_URL = 'https://pixset-api-production.up.railway.app';
let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {
  const userStr = localStorage.getItem('currentUser');
  if (!userStr) { window.location.href = '/pixset-ai-studio/'; return; }
  currentUser = JSON.parse(userStr);
  document.getElementById('user-name').textContent = currentUser.firstName || currentUser.username || 'User';
  if (currentUser.photoUrl) {
    const avatar = document.getElementById('user-avatar');
    avatar.src = currentUser.photoUrl;
    avatar.style.display = 'block';
  }
  
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.onclick = () => {
      const tool = item.getAttribute('data-tool');
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
      item.classList.add('active');
      document.getElementById(tool).classList.add('active');
    };
  });
  loadAllLimits();
});

async function loadAllLimits() {
  const actions = ['pixgen', 'pixgpt', 'pixqr'];
  for (const action of actions) {
    try {
      const res = await fetch(`${API_URL}/api/usage/check/${currentUser.id}/${action}`);
      const data = await res.json();
      const el = document.getElementById(`${action}-limit`);
      if (el) el.textContent = `${data.used}/${data.limit}`;
      const fill = document.getElementById(`${action}-fill`);
      if (fill) fill.style.width = (data.used / data.limit * 100) + '%';
    } catch (e) { console.warn('Limit fetch failed, using default'); }
  }
}

async function logUsage(action) {
  try {
    await fetch(`${API_URL}/api/usage/log`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser.id, action })
    });
    loadAllLimits();
  } catch (e) { console.warn('Log failed'); }
}

async function generateImage() {
  const prompt = document.getElementById('pixgen-prompt').value;
  if (!prompt) return showToast('Введите текст');
  const btn = event.target; btn.disabled = true; btn.textContent = '⏳...';
  const url = `https://api.pollinations.ai/v1/images?prompt=${encodeURIComponent(prompt)}&seed=${Math.floor(Math.random()*1000000)}`;
  const img = document.getElementById('pixgen-result');
  img.onload = () => {
    document.getElementById('pixgen-output').style.display = 'block';
    btn.disabled = false; btn.textContent = '🚀 Генерировать';
    logUsage('pixgen');
    showToast('✓ Готово');
  };
  img.src = url;
}

let chatHistory = [];
async function sendMessage() {
  const input = document.getElementById('pixgpt-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; addMsg('user', text);
  try {
    const res = await fetch('https://api.pollinations.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'openai', messages: [...chatHistory, { role: 'user', content: text }] })
    });
    const data = await res.json();
    const reply = data.choices[0].message.content;
    addMsg('assistant', reply);
    chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
    logUsage('pixgpt');
  } catch (e) { showToast('✗ Ошибка'); }
}

function addMsg(role, content) {
  const box = document.getElementById('pixgpt-messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = DOMPurify.sanitize(marked.parse(content));
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}

function generateQR() {
  const text = document.getElementById('pixqr-input').value;
  if (!text) return showToast('Введите текст');
  const display = document.getElementById('qr-code-display');
  display.innerHTML = '';
  new QRCode(display, { text, width: 200, height: 200 });
  document.getElementById('pixqr-output').style.display = 'block';
  logUsage('pixqr');
}

async function upscaleImage() {
  const file = document.getElementById('pixupscale-input').files[0];
  if (!file) return showToast('Выберите файл');
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width * 2; canvas.height = img.height * 2;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      document.getElementById('pixupscale-result').src = canvas.toDataURL();
      document.getElementById('pixupscale-output').style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#39ff14;color:#000;padding:10px 20px;border-radius:4px;z-index:9999;font-family:monospace;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function logout() { localStorage.removeItem('currentUser'); window.location.href = '/pixset-ai-studio/'; }
</script>
</body>
</html>
