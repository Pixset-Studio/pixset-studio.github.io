<style>
  /* Карточка игрока. Аватар получает размеры прямо здесь и в разметке: одна
     закэшированная браузером таблица стилей превращала его в картинку
     натуральной величины, вылезающую за рамку. */
  .pcard { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .pcard .ava {
    width: 96px; height: 96px; flex: 0 0 96px;
    border: 2px solid var(--y); border-radius: var(--radius);
    background: rgba(255,212,0,.07); overflow: hidden;
    display: grid; place-items: center;
    font-family: var(--font-head); font-size: 38px; color: var(--y); line-height: 1;
  }
  .pcard .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pcard h2 { margin: 0 0 4px; }

  /* ── Карточка игры ──────────────────────────────────────────────────────
     Шапка: название, звание и общая доля прохождения. Дальше — числа,
     разложенные по смыслу: сперва прохождение, потом рекорды, потом бой. */
  .gstats { display: grid; gap: 16px; margin-top: 10px; }
  .gcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
  .ghead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ghead h3 { margin: 0; }
  .gdone { margin: 14px 0 4px; max-width: 420px; }
  .gdone .cap { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
                text-transform: uppercase; letter-spacing: 1px; }
  .gdone .num { font-family: var(--font-head); font-weight: var(--head-weight);
                font-size: 26px; color: var(--y); line-height: 1.2; }

  .gsec { font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px;
          text-transform: uppercase; color: var(--y); margin: 22px 0 10px;
          padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .gnums { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }

  /* Иконка и число в строке, подпись под ними: подпись сбоку читается как
     обрывок фразы («хардкор 103»), а под числом — как заголовок графы. */
  .gnum { border: 1px solid var(--line); border-radius: var(--radius);
          padding: 12px 14px; background: var(--bg-2); }
  .gnum .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .gnum .ico { font-size: 15px; line-height: 1; flex: 0 0 auto; }
  .gnum b { font-family: var(--font-head); font-weight: var(--head-weight);
            font-size: 21px; color: #fff; line-height: 1.15; }
  .gnum .of { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
  .gnum .lab { display: block; font-family: var(--font-mono); font-size: 11px;
               color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
               margin-top: 6px; line-height: 1.5; }
  .gbar { height: 5px; background: var(--bg); border: 1px solid var(--line);
          margin-top: 9px; border-radius: 2px; overflow: hidden; }
  .gbar > i { display: block; height: 100%; background: var(--y); }
  /* Пиксельный шрифт крупнее своего кегля — иначе числа не влезают в плитку. */
  :root[data-theme='byteblaster'] .gnum b,
  :root[data-theme='arcade'] .gnum b { font-size: 13px; }
</style>
<script>
/* Тема и язык ставятся до первой отрисовки, иначе страница мигнёт чужим
   оформлением и чужим алфавитом. */
(function(){var d=document.documentElement;
try{var t=localStorage.getItem('pixsetTheme');
/* Тема Byte Blaster открыта владельцам лицензии. Ответ сервера кэширован
   (pixsetOwnsBB): сюда, до первой отрисовки, сетевой запрос не успеет. */
var own=false;try{var o=JSON.parse(localStorage.getItem('pixsetOwnsBB')||'null');own=!!(o&&o.own);}catch(e2){}
if(t==='byteblaster'&&!own)t='industrial';
if(t!=='arcade'&&t!=='minimal'&&t!=='industrial'&&t!=='byteblaster')t='industrial';
d.setAttribute('data-theme',t);}catch(e){d.setAttribute('data-theme','industrial');}
try{var l=localStorage.getItem('pixsetSiteLang')||localStorage.getItem('bbSiteLang');
if(l!=='ru'&&l!=='en'){var b=(navigator.languages&&navigator.languages[0])||navigator.language||'ru';
l=/^(ru|uk|be|kk|ky|uz|tg|tk|az|hy)/i.test(b)?'ru':'en';}
d.setAttribute('data-site-lang',l);d.setAttribute('lang',l);}
catch(e){d.setAttribute('data-site-lang','ru');}})();
</script>
<!-- поиск: этот блок дописывает seo.js, править вручную незачем -->

<script src="/assets/studio.js"></script>
<script type="module">
import {
  supabase, getPublicProfile, sendFriendRequest, getFriends, humanError,
} from '/assets/pixset-auth.js?v=d9da1664';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Строка на языке страницы. Разметке хватает атрибута data-l, но то, что
    рисует этот скрипт, выбирается здесь. */
const L = (ru, en) => (window.PixsetLang ? window.PixsetLang.L(ru, en) : ru);
const isEn = () => !!(window.PixsetLang && window.PixsetLang.now() === 'en');

function say(text, kind = 'err') {
  $('msg').textContent = text;
  $('msg').className = `msg show ${kind}`;
}

/* ── Что показываем и как это называется ─────────────────────────────────
   Каждая игра публикует свою сводку сама, поэтому набор полей у неё свой.
   Здесь описано, ЧТО из неё показывать, в каком разделе и КАК подписать —
   незнакомые поля просто не выводятся, а не ломают карточку. Добавили игре
   новое число — допишите строку сюда, менять больше ничего не нужно.

   Подписи развёрнутые не для красоты: «Хардкор 103» ни о чём не говорит, а
   «103 / 110 · уровни в хардкоре» — говорит. */
const GROUPS = [
  {
    ru: 'Прохождение', en: 'Campaign',
    fields: [
      { key: 'levels',     ico: '▦',  max: 'levelsMax',   ru: 'Уровни кампании',       en: 'Campaign levels' },
      { key: 'hardcore',   ico: '💀', max: 'hardcoreMax', ru: 'Уровни в хардкоре',     en: 'Hardcore levels' },
      { key: 'worlds',     ico: '🌐', max: 'worldsMax',   ru: 'Открыто миров',         en: 'Worlds reached' },
      { key: 'bosses',     ico: '👹', max: 'bossesMax',   ru: 'Побеждено боссов',      en: 'Bosses defeated' },
      { key: 'bossesHard', ico: '☠️', max: 'bossesMax',   ru: 'Боссы в хардкоре',      en: 'Bosses on hardcore' },
      { key: 'stars',      ico: '⭐', max: 'starsMax',    ru: 'Собрано звёзд',         en: 'Stars collected' },
      { key: 'stars3',     ico: '✨', ru: 'Уровней на три звезды',                     en: 'Levels at three stars' },
      { key: 'crystals',   ico: '💠', max: 'crystalsMax', ru: 'Кристаллы данных',      en: 'Data crystals' },
      { key: 'rainbow',    ico: '🌈', max: 'rainbowMax',  ru: 'Радужные осколки',      en: 'Rainbow shards' },
      { key: 'ach',        ico: '🏆', max: 'achMax',      ru: 'Достижения',            en: 'Achievements' },
      { key: 'logs',       ico: '📖', max: 'logsMax',     ru: 'Записи сюжетного архива', en: 'Story archive entries' },
    ],
  },
  {
    ru: 'Рекорды', en: 'Records',
    fields: [
      { key: 'score',    ico: '🎯', ru: 'Очков за всё время',      en: 'Score all-time' },
      { key: 'bestAdv',  ico: '🚩', ru: 'Лучший забег в кампании', en: 'Best campaign run' },
      { key: 'bestInf',  ico: '♾️', ru: 'Рекорд в бесконечном',    en: 'Best endless run' },
      { key: 'coins',    ico: '🪙', ru: 'Собрано монет',           en: 'Coins collected' },
      { key: 'playtime', ico: '⏱️', ru: 'Времени в игре',          en: 'Time played', fmt: 'time' },
    ],
  },
  {
    ru: 'Боевой почерк', en: 'Combat record',
    fields: [
      { key: 'kills',        ico: '💥', ru: 'Побеждено врагов',     en: 'Enemies defeated' },
      { key: 'stompKills',   ico: '👟', ru: 'Врагов — прыжком',     en: 'Enemies — stomped' },
      { key: 'blasterKills', ico: '🔫', ru: 'Врагов — из бластера', en: 'Enemies — blasted' },
      { key: 'burnKills',    ico: '🔥', ru: 'Врагов — огнём',       en: 'Enemies — burned' },
      { key: 'freezeKills',  ico: '❄️', ru: 'Врагов — льдом',       en: 'Enemies — frozen' },
      { key: 'perfect',      ico: '💯', ru: 'Идеальных уровней',    en: 'Flawless levels' },
      { key: 'streak',       ico: '🔗', ru: 'Серия без смертей',    en: 'No-death streak' },
      { key: 'deaths',       ico: '⚰️', ru: 'Смертей за всё время', en: 'Deaths all-time' },
      { key: 'jumps',        ico: '🦿', ru: 'Прыжков сделано',      en: 'Jumps made' },
    ],
  },
];

/* Звание Byte Blaster приходит ключом (rank0…rank6) — карточка показывает
   его на языке читателя, а не на языке того, кто играл. */
const RANKS = {
  rank0: ['Нарушитель', 'Intruder'],
  rank1: ['Диверсант', 'Saboteur'],
  rank2: ['Призрак в сети', 'Ghost in the GRID'],
  rank3: ['Взломщик защиты', 'Firewall breaker'],
  rank4: ['Еретик системы', 'System heretic'],
  rank5: ['Разрыв протокола', 'Protocol breaker'],
  rank6: ['Свободен', 'Free'],
};

const fmtNum = (n) => Number(n || 0).toLocaleString(isEn() ? 'en-US' : 'ru-RU');
function fmtTime(sec) {
  const s = Number(sec) || 0;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? L(`${h} ч ${m} мин`, `${h} h ${m} min`) : L(`${m} мин`, `${m} min`);
}
const fmtDate = (iso) => new Date(iso).toLocaleDateString(isEn() ? 'en-GB' : 'ru-RU');

function statCard(f, d) {
  const value = f.fmt === 'time' ? fmtTime(d[f.key]) : fmtNum(d[f.key]);
  const total = (f.max != null && d[f.max] != null) ? Number(d[f.max]) || 0 : null;
  const pct = total ? Math.max(0, Math.min(100,
    Math.round((Number(d[f.key]) || 0) / total * 100))) : null;

  return `<div class="gnum">
    <div class="top"><span class="ico">${f.ico}</span><b>${esc(value)}</b>${
      total != null ? `<span class="of">/ ${esc(fmtNum(total))}</span>` : ''}</div>
    <span class="lab">${esc(L(f.ru, f.en))}</span>
    ${pct != null ? `<div class="gbar"><i style="width:${pct}%"></i></div>` : ''}
  </div>`;
}

function gameCard(g) {
  const d = (g && g.data) || {};

  const groups = GROUPS.map((grp) => {
    const cards = grp.fields.filter((f) => d[f.key] != null).map((f) => statCard(f, d)).join('');
    return cards ? `<div class="gsec">${esc(L(grp.ru, grp.en))}</div><div class="gnums">${cards}</div>` : '';
  }).join('');

  // Общая доля прохождения — если игра посчитала её сама.
  const pct = d.completion != null ? Math.max(0, Math.min(100, Math.round(d.completion * 100))) : null;
  const rank = (d.rank && RANKS[d.rank]) ? L(RANKS[d.rank][0], RANKS[d.rank][1]) : null;

  return `<div class="gcard">
    <div class="ghead">
      <h3>${esc(g.title || g.game_slug)}</h3>
      ${rank ? `<span class="badge">${esc(rank)}</span>` : ''}
    </div>
    ${pct != null ? `<div class="gdone">
        <div class="cap">${esc(L('Игра пройдена на', 'Game completed'))}</div>
        <div class="num">${pct}%</div>
        <div class="gbar"><i style="width:${pct}%"></i></div>
      </div>` : ''}
    ${groups || `<p class="dim">${esc(L('Игрок ещё не начинал.', 'This player has not started yet.'))}</p>`}
    <div class="dim mono" style="margin-top:16px;font-size:12px">${
      esc(L('Обновлено ', 'Updated '))}${g.updated_at ? esc(fmtDate(g.updated_at)) : '—'}</div>
  </div>`;
}

const nickParam = new URLSearchParams(location.search).get('n');
let loaded = null;               // ответ сервера: по нему перерисовываемся при смене языка

function paintProfile() {
  if (!loaded) return;
  $('since').textContent = loaded.created_at
    ? L('С нами с ', 'With us since ') + fmtDate(loaded.created_at) : '';
  const games = Array.isArray(loaded.games) ? loaded.games : [];
  $('games').innerHTML = games.length
    ? games.map(gameCard).join('')
    : `<div class="gcard"><p class="dim">${esc(L(
        'Игрок пока не публиковал прогресс. Он появляется, когда игра сохраняет прогресс в аккаунт.',
        'This player has not published any progress yet. It appears once a game saves progress to the account.'))}</p></div>`;
}

// Язык меняется без перезагрузки — числа и подписи пересобираем на месте.
document.addEventListener('pixset:lang', paintProfile);

async function render() {
  if (!nickParam) {
    $('loading').hidden = true;
    say(L('Не указан ник игрока.', 'No player nickname given.'));
    return;
  }

  let profile = null;
  try { profile = await getPublicProfile(nickParam); }
  catch (err) { $('loading').hidden = true; say(humanError(err)); return; }

  $('loading').hidden = true;
  if (!profile) { say(L('Игрок с таким ником не найден.', 'No player with that nickname.')); return; }

  loaded = profile;
  document.title = profile.nickname + ' — Pixset Studio';
  $('nick').textContent = profile.nickname;

  // В src пускаем только картинку: в колонке может оказаться что угодно.
  const url = profile.avatar_url;
  if (/^data:image\/(png|jpeg|webp);base64,/.test(url || '')) {
    $('ava').innerHTML = `<img alt="" src="${esc(url)}">`;
  } else {
    $('ava').textContent = (profile.nickname || '?').charAt(0).toUpperCase();
  }

  paintProfile();
  $('card').hidden = false;

  // Кнопка «в друзья» — только вошедшему и только если он ещё не в связи.
  const { data: { session } } = await supabase.auth.getSession();
  if (!session || session.user.id === profile.id) return;
  let linked = false;
  try { linked = (await getFriends()).some((f) => f.id === profile.id); } catch { linked = false; }
  if (linked) return;

  const btn = $('addBtn');
  btn.hidden = false;
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      const res = await sendFriendRequest(profile.nickname);
      say(res === 'accepted'
        ? L('Теперь вы друзья.', 'You are friends now.')
        : L('Заявка отправлена.', 'Request sent.'), 'ok');
      btn.hidden = true;
    } catch (err) { say(humanError(err)); btn.disabled = false; }
  };
}

render();
</script>
